<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Like</title>
    <link rel="stylesheet" href="MeGusta.css">
</head>
<body>

    <nav>
        <h1>Social Like</h1>
    </nav>

    <main class="container">

        <aside class="perfil">
            <img src="tuailait.jpg" alt="Foto de perfil">
            <h2>Twilight</h2>
            <button id="visualizarPerfil" class="btn-perfil">Mi perfil</button>
        </aside>

        <section class="publicaciones">
            <h2>Últimas publicaciones</h2>

            <article class="post">
                <div class="post-header">
                    <h3>Starlight Glimmer</h3>
                    <div>
                        <span class="likes1" id="numlike1">0</span>
                        <button id="btnlike1" class="btn-like1">Like</button>
                    </div>
                </div>

                <p>Acabo de configurar este nuevo <a href="#">bot de Discord</a>, cuéntame qué opinan ustedes.</p>
            </article>

            <article class="post">
                <div class="post-header">
                    <h3>Sunset Shimmer</h3>
                    <div>
                        <span class="likes2" id="numlike2">0</span>
                        <button id="btnlike2" class="btn-like2">Like</button>
                    </div>
                </div>

                <p>
                    Acabo de leer este
                    <a href="#">nuevo cómic</a>. Denle un vistazo.
                </p>
            </article>

            <article class="post">
                <div class="post-header">
                    <h3>Apple Jack</h3>
                    <div>
                        <span class="likes3" id="numlike3">0</span>
                        <button id="btnlike3" class="btn-like3">Like</button>
                    </div>
                </div>
                <p>No puedo dejar de escuchar este <a href="#">álbum</a>. ¿A quién más le gusta?</p>
            </article>

        </section>

    </main>
</body>
<script defer src="MeGusta.js"></script>
</html>
